name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # A newer push cancels a PR's older run; every commit on main keeps its own result.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Same Xcode 27.2 the build Mac uses (AGENTS.md). The xcode-27 image is a GitHub preview label.
  DEVELOPER_DIR: /Applications/Xcode_27.2.0.app/Contents/Developer

jobs:
  test-and-build:
    runs-on: xcode-27
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Xcode version
        run: xcodebuild -version

      # The engine tests read the Android app's bundled assets (corpus, PT lexicon) from Fixtures/assets,
      # at the Android commit the golden fixtures were made from.
      - name: Android reference commit
        id: ref
        run: echo "sha=$(tr -d '[:space:]' < Fixtures/SOURCE_SHA)" >> "$GITHUB_OUTPUT"

      - name: Check out Android assets
        uses: actions/checkout@v4
        with:
          repository: rferrari/boar-app
          ref: ${{ steps.ref.outputs.sha }}
          path: .ref/boar-app
          sparse-checkout: assets
          persist-credentials: false

      - name: Link Android assets
        run: ln -s ../.ref/boar-app/assets Fixtures/assets

      - name: Cache llama.xcframework
        uses: actions/cache@v4
        with:
          path: Vendor/llama.xcframework
          key: llama-${{ hashFiles('scripts/fetch-llama.sh') }}

      - name: Fetch llama.xcframework
        run: bash scripts/fetch-llama.sh

      # Keyed on the sources too, so the cache follows the code; saved even when a test fails.
      - name: Restore SwiftPM build
        id: spm
        uses: actions/cache/restore@v4
        with:
          path: .build/ci
          key: spm-${{ runner.os }}-${{ hashFiles('Package.swift', 'Package.resolved') }}-${{ hashFiles('Sources/**', 'Tests/**') }}
          restore-keys: |
            spm-${{ runner.os }}-${{ hashFiles('Package.swift', 'Package.resolved') }}-
            spm-${{ runner.os }}-

      # Model smoke tests skip themselves without BOAR_TEST_GGUF; remote tests without BOAR_REMOTE_URL.
      # On GitHub (GITHUB_ACTIONS=true) the Vision OCR and Apple Intelligence checks skip, and timing limits widen.
      - name: Engine tests
        run: swift test --scratch-path .build/ci

      - name: Save SwiftPM build
        if: always() && steps.spm.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .build/ci
          key: ${{ steps.spm.outputs.cache-primary-key }}

      # XcodeGen pinned to the build Mac's version (checksum of the release zip), so the project doesn't drift.
      - name: Generate Xcode project
        env:
          XCODEGEN_VERSION: 2.46.0
          XCODEGEN_SHA256: 4d9e34b62172d645eed6457cac13fc222569974098ef4ee9c3368bedf0196806
        run: |
          curl -fsSL -o "$RUNNER_TEMP/xcodegen.zip" "https://github.com/yonaskolb/XcodeGen/releases/download/$XCODEGEN_VERSION/xcodegen.zip"
          echo "$XCODEGEN_SHA256  $RUNNER_TEMP/xcodegen.zip" | shasum -a 256 -c -
          unzip -q "$RUNNER_TEMP/xcodegen.zip" -d "$RUNNER_TEMP"
          "$RUNNER_TEMP/xcodegen/bin/xcodegen" generate

      - name: Build iOS app
        run: >
          xcodebuild -project Boar.xcodeproj -scheme Boar
          -destination 'generic/platform=iOS'
          -derivedDataPath .build/DerivedData
          CODE_SIGNING_ALLOWED=NO build

      - name: Build Mac app
        run: >
          xcodebuild -project Boar.xcodeproj -scheme BoarMac
          -destination 'platform=macOS'
          -derivedDataPath .build/DerivedData
          CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY=- DEVELOPMENT_TEAM=
          build
